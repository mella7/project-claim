name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the release it belongs to as a comment.
# A tag can be moved to different code after the fact. A commit cannot.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The CRDs, the ClusterRole and the DeepCopy code come from the Go
      # types. This fails when someone changed a type and did not regenerate.
      - run: make verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out

  mutation:
    name: tests catch known breakages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make mutation-test

  e2e:
    name: end to end on kind
    runs-on: ubuntu-latest
    needs: test
    env:
      IMG: project-claim:e2e
      CLUSTER: projectclaim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ${{ env.CLUSTER }}
      - name: Build the image and load it into the cluster
        run: |
          make docker-build IMG="$IMG"
          kind load docker-image "$IMG" --name "$CLUSTER"
      - name: Deploy the operator
        run: |
          make deploy IMG="$IMG"
          kubectl -n projectclaim-system rollout status deployment/projectclaim-controller-manager --timeout=180s
      # Unlike the envtest suite, this runs the real image as its real
      # ServiceAccount, with a controller manager that deletes namespaces.
      - name: Walk through the operator's behaviour
        run: make demo
      - name: Operator logs
        if: failure()
        run: |
          kubectl -n projectclaim-system get pods -o wide
          kubectl -n projectclaim-system logs deployment/projectclaim-controller-manager --all-containers --tail=300
          kubectl get projectclaims,tenants,projecttiers -o yaml
