apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: projectclaim-operator
  namespace: projectclaim-system
spec:
  groups:
    - name: projectclaim.rules
      rules:
        - alert: ProjectClaimNotServed
          expr: sum by (tenant, phase) (projectclaim_claims{phase=~"Degraded|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Tenant {{ $labels.tenant }} has claims in phase {{ $labels.phase }}"
            description: >-
              A claim was refused or its latest change could not be applied.
              `kubectl get projectclaims -o wide` shows the reason.
        - alert: ProjectClaimStuckTerminating
          expr: sum by (tenant) (projectclaim_claims{phase="Terminating"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "A project of tenant {{ $labels.tenant }} has been terminating for 30 minutes"
            description: >-
              The claim is waiting for its namespace to go away. Something in
              the namespace is probably held by a finalizer.
        - alert: TenantBudgetNearlyUsed
          expr: >-
            projectclaim_tenant_quota_allocated
              / on (tenant, resource) projectclaim_tenant_quota_budget > 0.9
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Tenant {{ $labels.tenant }} has used over 90% of its {{ $labels.resource }} budget"
        - alert: ProjectClaimFightingOverObjects
          # In a settled cluster the operator only reads. Steady updates mean
          # something else keeps changing what it manages.
          expr: sum by (kind) (rate(projectclaim_apply_total{result="updated"}[30m])) > 0.05
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The operator keeps correcting {{ $labels.kind }} objects"
            description: >-
              Another controller or a person keeps changing objects the
              operator manages, and the operator keeps changing them back.
        - alert: ProjectClaimReconcileErrors
          expr: sum(rate(controller_runtime_reconcile_errors_total{controller="projectclaim"}[10m])) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ProjectClaim reconciles are failing"
