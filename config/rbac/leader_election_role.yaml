# Leader election needs a Lease, and only in the operator's own namespace.
# That is why this is a Role and not part of the ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: projectclaim-leader-election
  namespace: projectclaim-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: projectclaim-leader-election
  namespace: projectclaim-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: projectclaim-leader-election
subjects:
  - kind: ServiceAccount
    name: projectclaim-controller-manager
    namespace: projectclaim-system
