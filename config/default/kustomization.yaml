# Everything needed to run the operator: CRDs, RBAC, the Deployment and the
# tenant ownership admission policy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../admission
images:
  - name: controller
    newName: ghcr.io/mella7/project-claim
    newTag: latest
